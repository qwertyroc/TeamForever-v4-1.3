name: iOS RSDK Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build RSDKv4 for iOS
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Clean and Install Dependencies
        run: |
          rm -rf build/ Payload/ *.ipa  # Clean up previous failed runs
          brew install sdl2 libogg libvorbis tinyxml2

      - name: Build and Pack
        run: |
          # 1. Setup Paths
          SDL2_PATH=$(brew --prefix sdl2)
          VORBIS_PATH=$(brew --prefix libvorbis)
          OGG_PATH=$(brew --prefix libogg)
          TINYXML2_PATH=$(brew --prefix tinyxml2)
          
          # 2. Setup Dependencies (Crucial for success)
          mkdir -p dependencies/ios
          git clone https://github.com/icculus/theoraplay.git /tmp/theoraplay
          cp /tmp/theoraplay/theoraplay.[ch] dependencies/ios/
          
          # 3. Create Dummy Files to satisfy Asset/Resource requirements
          touch dependencies/ios/Data.rsdk
          touch dependencies/ios/Default.png
          mkdir -p dependencies/ios/Assets.xcassets/AppIcon.appiconset
          cat <<EOF > dependencies/ios/Assets.xcassets/AppIcon.appiconset/Contents.json
          {"images":[],"info":{"version":1,"author":"xcode"}}
          EOF

          # 4. Build with "Ignore Warnings" and "No Signing"
          xcodebuild -project "RSDKv4 ios.xcodeproj" \
                     -scheme "RSDKv4" \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath ./build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     GCC_TREAT_WARNINGS_AS_ERRORS=NO \
                     WARNING_CFLAGS="-Wno-error -Wno-implicit-function-declaration" \
                     HEADER_SEARCH_PATHS="./dependencies/ios $SDL2_PATH/include $VORBIS_PATH/include $OGG_PATH/include $TINYXML2_PATH/include" \
                     LIBRARY_SEARCH_PATHS="./dependencies/ios $SDL2_PATH/lib $VORBIS_PATH/lib $OGG_PATH/lib $TINYXML2_PATH/lib" \
                     GCC_PREPROCESSOR_DEFINITIONS="\$(inherited) RSDK_REVISION=2 RETRO_USING_OPENGL_ES" \
                     OTHER_LDFLAGS="-Wl,-fatal_warnings -Wl,-ignore_auto_link" \
                     build

          # 5. Packaging
          mkdir -p Payload
          APP_DIR=$(find ./build -name "RSDKv4.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then echo "❌ App not found!"; exit 1; fi
          cp -r "$APP_DIR" Payload/
          
          SHORT_SHA=$(git rev-parse --short HEAD)
          IPA_NAME="RSDKv4-Build-${SHORT_SHA}.ipa"
          zip -r "$IPA_NAME" Payload
          echo "IPA_FILENAME=$IPA_NAME" >> $GITHUB_ENV

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv4-iOS-Package
          path: ${{ env.IPA_FILENAME }}
