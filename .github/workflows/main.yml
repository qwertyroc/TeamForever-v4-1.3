name: iOS Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install sdl2 libvorbis libogg tinyxml2
          # Ensure theoraplay is available. If it's a local dependency, 
          # confirm it exists in your folder structure.

      - name: Locate missing headers (Debug)
        run: |
          echo "Looking for theoraplay.h..."
          find . -name "theoraplay.h" || echo "Not found in project"
          ls -R $(brew --prefix)/include | grep theoraplay || echo "Not found in brew"

      - name: Build Project
        run: |
          # Calculate paths dynamically
          SDL_INC=$(brew --prefix sdl2)/include
          VORBIS_INC=$(brew --prefix libvorbis)/include
          OGG_INC=$(brew --prefix libogg)/include
          TINYXML_INC=$(brew --prefix tinyxml2)/include
          
          # Add the folder containing theoraplay.h to this list
          # Replace 'path/to/theoraplay' with the actual folder path found in the debug step
          HEADERS="./RSDKv4 ./dependencies/ios ./path/to/theoraplay $SDL_INC $VORBIS_INC $OGG_INC $TINYXML_INC"
          
          xcodebuild -project "RSDKv4 ios.xcodeproj" \
            -scheme "RSDKv4" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            WARNING_CFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-deprecated-declarations -Wno-nonportable-include-path" \
            HEADER_SEARCH_PATHS="$HEADERS" \
            LIBRARY_SEARCH_PATHS="./dependencies/ios $(brew --prefix sdl2)/lib $(brew --prefix libvorbis)/lib $(brew --prefix libogg)/lib $(brew --prefix tinyxml2)/lib" \
            GCC_PREPROCESSOR_DEFINITIONS="\$(inherited) RETRO_USING_OPENGL_ES" \
            OTHER_LDFLAGS="-Wl,-fatal_warnings -Wl,-ignore_auto_link" \
            build
