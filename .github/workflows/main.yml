name: iOS RSDK Build
on:
  push:
  pull_request:
jobs:
  build:
    name: Build RSDKv4 for iOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Dependencies
  run: brew install sdl2 libvorbis

      - name: Build and Pack
        run: |
          SDL2_PATH=$(brew --prefix sdl2)
          PREPROCESSOR_DEFS='$(inherited) RSDK_REVISION=0 RETRO_USING_OPENGL_ES'

          mkdir -p dependencies/ios
          touch dependencies/ios/Data.rsdk

          xcodebuild -project "RSDKv4 ios.xcodeproj" \
                     -scheme "RSDKv4" \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath ./build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     FRAMEWORK_SEARCH_PATHS="./dependencies/ios $SDL2_PATH/lib" \
                     HEADER_SEARCH_PATHS="./dependencies/ios $SDL2_PATH/include" \
                     LIBRARY_SEARCH_PATHS="./dependencies/ios $SDL2_PATH/lib" \
                     GCC_PREPROCESSOR_DEFINITIONS="$PREPROCESSOR_DEFS" \
                     EXCLUDED_SOURCE_FILE_NAMES="dependencies/mac/*" \
                     build

          mkdir -p Payload
          APP_DIR=$(find ./build -name "RSDKv4.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then echo "❌ App not found!"; exit 1; fi
          cp -r "$APP_DIR" Payload/
          zip -r RSDKv4.ipa Payload

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv4-iOS-Package
          path: RSDKv4.ipa
