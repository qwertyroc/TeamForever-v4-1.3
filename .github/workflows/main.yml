name: iOS RSDK Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build RSDKv4 for iOS
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Clean and Install Dependencies
        run: |
          rm -rf build/ Payload/ *.ipa  # Clean up previous failed runs
          brew install sdl2 libogg libvorbis tinyxml2

      - name: Build and Pack
        run: |
          # 1. Setup Dependencies
          mkdir -p dependencies/ios
          
          # Clone Theoraplay
          git clone https://github.com/icculus/theoraplay.git /tmp/theoraplay
          cp /tmp/theoraplay/theoraplay.[ch] dependencies/ios/
          
          # 2. Fix Case-Sensitivity (RetroEngine.hpp looks for <Vorbis/...)
          # Homebrew/Linux headers use lowercase <vorbis/...>
          mkdir -p dependencies/ios/Vorbis
          ln -s $(brew --prefix libvorbis)/include/vorbis/vorbisfile.h dependencies/ios/Vorbis/vorbisfile.h
          ln -s $(brew --prefix libvorbis)/include/vorbis/codec.h dependencies/ios/Vorbis/codec.h

          # 3. Create Dummy Assets
          touch dependencies/ios/Data.rsdk
          touch dependencies/ios/Default.png
          mkdir -p dependencies/ios/Assets.xcassets/AppIcon.appiconset
          echo '{"images":[],"info":{"version":1,"author":"xcode"}}' > dependencies/ios/Assets.xcassets/AppIcon.appiconset/Contents.json

          # 4. Build
          # Note: We are removing RSDK_REVISION from DEFS because it's already in the header
          xcodebuild -project "RSDKv4 ios.xcodeproj" \
                     -scheme "RSDKv4" \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath ./build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     GCC_TREAT_WARNINGS_AS_ERRORS=NO \
                     HEADER_SEARCH_PATHS="./dependencies/ios $(brew --prefix sdl2)/include $(brew --prefix libvorbis)/include $(brew --prefix libogg)/include $(brew --prefix tinyxml2)/include" \
                     LIBRARY_SEARCH_PATHS="./dependencies/ios $(brew --prefix sdl2)/lib $(brew --prefix libvorbis)/lib $(brew --prefix libogg)/lib $(brew --prefix tinyxml2)/lib" \
                     GCC_PREPROCESSOR_DEFINITIONS="\$(inherited) RETRO_USING_OPENGL_ES" \
                     OTHER_LDFLAGS="-Wl,-fatal_warnings -Wl,-ignore_auto_link" \
                     build

          # 5. Packaging
          mkdir -p Payload
          APP_DIR=$(find ./build -name "RSDKv4.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then echo "❌ App not found!"; exit 1; fi
          cp -r "$APP_DIR" Payload/
          zip -r "RSDKv4-Build.ipa" Payload
      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv4-iOS-Package
          path: ${{ env.IPA_FILENAME }}
