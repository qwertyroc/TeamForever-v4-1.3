name: iOS RSDK Build

on:
  push:
    branches: [ "foreve" ]
  pull_request:
    branches: [ "foreve" ]

jobs:
  build:
    name: Build RSDKv4 for iOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Workspace
        run: |
          mkdir -p dependencies/ios
          touch dependencies/ios/Data.rsdk

      - name: Build
        run: |
          xcodebuild -project "RSDKv4 ios.xcodeproj" \
                     -scheme "RSDKv4" \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     FRAMEWORK_SEARCH_PATHS="./dependencies/ios" \
                     GCC_PREPROCESSOR_DEFINITIONS='$(inherited) RSDK_REVISION=0 RETRO_USING_OPENGL_ES' \
                     build


      - name: Pack IPA
        if: always()
        run: |
          mkdir -p Payload
          # Search everywhere for any .app folder created during this run
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d -path "*/Release-iphoneos/*" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ CRITICAL ERROR: Could not find the compiled .app file."
            exit 1
          fi
          
          echo "✅ Found app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r RSDKv4.ipa Payload
          
      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv4-iOS-Package
          path: RSDKv4.ipa
