name: iOS RSDK Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build RSDKv4 for iOS
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Dependencies
        run: brew install sdl2 libogg libvorbis tinyxml2

      - name: Configure Build Environment
        run: |
          # Create an xcconfig to handle paths and bypass signing requirements
          cat <<EOF > ci.xcconfig
          HEADER_SEARCH_PATHS = \$(inherited) ./dependencies/ios $(brew --prefix sdl2)/include $(brew --prefix libvorbis)/include $(brew --prefix libogg)/include $(brew --prefix tinyxml2)/include
          LIBRARY_SEARCH_PATHS = \$(inherited) ./dependencies/ios $(brew --prefix sdl2)/lib $(brew --prefix libvorbis)/lib $(brew --prefix libogg)/lib $(brew --prefix tinyxml2)/lib
          GCC_PREPROCESSOR_DEFINITIONS = \$(inherited) RSDK_REVISION=0 RETRO_USING_OPENGL_ES
          
          # Force bypass signing in the config file itself
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY = 
          PROVISIONING_PROFILE_SPECIFIER = 
          EOF

      - name: Install theoraplay
        run: |
          git clone https://github.com/icculus/theoraplay.git /tmp/theoraplay
          mkdir -p dependencies/ios
          cp /tmp/theoraplay/theoraplay.h dependencies/ios/theoraplay.h
          cp /tmp/theoraplay/theoraplay.c dependencies/ios/theoraplay.c

      - name: Build and Pack
        run: |
          # 1. Ensure those missing resource files exist so the Copy phase doesn't crash
          mkdir -p dependencies/ios
          touch dependencies/ios/Data.rsdk
          touch dependencies/ios/Default.png

          # 2. Build using the xcconfig and explicit bypass flags
          xcodebuild -project "RSDKv4 ios.xcodeproj" \
                     -scheme "RSDKv4" \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath ./build \
                     -xcconfig ci.xcconfig \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     build

          # 3. Create the IPA (Payload folder)
          mkdir -p Payload
          APP_DIR=$(find ./build -name "RSDKv4.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then echo "❌ App not found!"; exit 1; fi
          cp -r "$APP_DIR" Payload/
          zip -r RSDKv4.ipa Payload

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv4-iOS-Package
          path: RSDKv4.ipa
