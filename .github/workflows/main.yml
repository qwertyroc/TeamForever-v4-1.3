name: iOS Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Playable RSDKv4 iOS
    runs-on: macos-latest 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools
        run: |
          brew update
          brew install sdl2 libvorbis libogg tinyxml2

      - name: Patch Xcode Project (No Xcode Needed)
        run: |
          echo "Patching Xcode project to remove broken references..."
          
          # 1. Remove the legacy SDLMain requirement from the Xcode project file
          sed -i '' 's/-lSDLMain//g' "RSDKv4 ios.xcodeproj/project.pbxproj"
          
          # 2. Fix case-sensitivity include issue in RetroEngine.hpp
          if [ -f "./RSDKv4/RetroEngine.hpp" ]; then
            sed -i '' 's|<Vorbis/vorbisfile.h>|<vorbis/vorbisfile.h>|g' ./RSDKv4/RetroEngine.hpp
          fi
          
          # 3. Create missing C++ files (WARNING: If your game needs these to run, you MUST upload the real ones to your repo!)
          touch ./RSDKv4/RetroGameLoop.cpp
          touch ./RSDKv4/PauseMenu.cpp
          
          # 4. Create the dummy Data.rsdk game file (You will add the real one via the iOS Files App later)
          mkdir -p dependencies/ios
          touch dependencies/ios/Data.rsdk
          
          # 5. Generate a valid Info.plist ID card for the app
          if [ ! -f "dependencies/ios/Info.plist" ]; then
            cat << 'EOF' > dependencies/ios/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>com.retro.rsdk</string>
              <key>CFBundleName</key>
              <string>Sonic CD</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>UIRequiresFullScreen</key>
              <true/>
          </dict>
          </plist>
          EOF
          fi
        shell: /bin/bash -e {0}

      - name: Build iOS App
        run: |
          ROOT_DIR=$(pwd)
          
          # Define Homebrew paths for Headers
          SDL_INC=$(brew --prefix sdl2)/include
          VORBIS_INC=$(brew --prefix libvorbis)/include
          OGG_INC=$(brew --prefix libogg)/include
          TINYXML_INC=$(brew --prefix tinyxml2)/include
          
          # Locate headers dynamically
          THEORA_PATH=$(find . -name "theoraplay.h" | head -n 1)
          THEORA_DIR=$(dirname "$THEORA_PATH")
          
          NATIVE_PATH=$(find . -name "NativeObjects.hpp" | head -n 1)
          NATIVE_DIR=$(dirname "$NATIVE_PATH")
          
          # Construct Paths
          HEADERS="$ROOT_DIR/RSDKv4 $ROOT_DIR/dependencies/ios $ROOT_DIR/$THEORA_DIR $ROOT_DIR/$NATIVE_DIR $SDL_INC $VORBIS_INC $OGG_INC $TINYXML_INC"
          
          # Run xcodebuild using the REAL frameworks you uploaded
          xcodebuild build \
            -project "RSDKv4 ios.xcodeproj" \
            -scheme "RSDKv4" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            HEADER_SEARCH_PATHS="$HEADERS" \
            FRAMEWORK_SEARCH_PATHS="$ROOT_DIR/dependencies/ios" \
            LIBRARY_SEARCH_PATHS="$ROOT_DIR/dependencies/ios" \
            GCC_PREPROCESSOR_DEFINITIONS="\$(inherited) RETRO_USING_OPENGL_ES" \
            OTHER_CFLAGS="-Wno-deprecated-declarations -Wno-error"
        shell: /bin/bash -e {0}

      - name: Package IPA
        run: |
          mkdir -p Payload
          mv build/Build/Products/Release-iphoneos/RSDKv4.app Payload/
          zip -r RSDKv4.ipa Payload

      - name: Upload Playable IPA
        uses: actions/upload-artifact@v4
        with:
          name: RSDK4-iOS
          path: RSDKv4.ipa
