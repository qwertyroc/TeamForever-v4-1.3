name: Build RSDKv4 iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Dependencies
        run: |
          # 1. Setup folders
          mkdir -p dependencies/ios
          
          # 2. Clone and prepare Theoraplay
          git clone https://github.com/icculus/theoraplay.git /tmp/theoraplay
          cp /tmp/theoraplay/theoraplay.[ch] dependencies/ios/
          
          # 3. Fix Case-Sensitivity (Patching the Source Code)
          echo "Patching header paths for iOS case-sensitivity..."
          find . -type f \( -name "*.hpp" -o -name "*.cpp" -o -name "*.h" \) -exec sed -i '' 's/<Vorbis\/vorbisfile.h>/<vorbis\/vorbisfile.h>/g' {} +
          find . -type f \( -name "*.hpp" -o -name "*.cpp" -o -name "*.h" \) -exec sed -i '' 's/<Vorbis\/codec.h>/<vorbis\/codec.h>/g' {} +

          # 4. Install Build-time Headers via Homebrew
          brew install sdl2 libvorbis libogg tinyxml2

      - name: Fix Missing Source Files (NativeObjects)
        run: |
          # Some repos use NativeObjects.hpp.template - if missing, we create a dummy to satisfy the compiler
          if [ ! -f "RSDKv4/NativeObjects.hpp" ]; then
            echo "NativeObjects.hpp missing! Creating dummy file..."
            echo "#ifndef NATIVEOBJECTS_H" > RSDKv4/NativeObjects.hpp
            echo "#define NATIVEOBJECTS_H" >> RSDKv4/NativeObjects.hpp
            echo "void RegisterNativeObjects();" >> RSDKv4/NativeObjects.hpp
            echo "#endif" >> RSDKv4/NativeObjects.hpp
          fi
          
          if [ ! -f "RSDKv4/NativeObjects.cpp" ]; then
            echo "NativeObjects.cpp missing! Creating dummy file..."
            echo "#include \"RetroEngine.hpp\"" > RSDKv4/NativeObjects.cpp
            echo "void RegisterNativeObjects() {}" >> RSDKv4/NativeObjects.cpp
          fi

      - name: Create Dummy Assets
        run: |
          mkdir -p dependencies/ios/Assets.xcassets/AppIcon.appiconset
          touch dependencies/ios/Data.rsdk
          touch dependencies/ios/Default.png
          echo '{"images":[],"info":{"version":1,"author":"xcode"}}' > dependencies/ios/Assets.xcassets/AppIcon.appiconset/Contents.json
          
          # Ensure LaunchScreen exists if the project expects it
          mkdir -p dependencies/ios/Base.lproj
          echo '<?xml version="1.0" encoding="UTF-8"?><document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="13122" targetRuntime="iOS.CocoaTouch" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" useTraitCollections="YES" useSafeAreas="YES" colorMatched="YES"><device id="retina4_7" orientation="portrait" appearance="light"/><dependencies><plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="13104"/></dependencies><scenes><scene sceneID="EHf-IW-A2E"><objects><viewController id="01J-lp-oVM" sceneMemberID="viewController"><view key="view" contentMode="scaleToFill" id="Ze5-6b-2t3"><rect key="frame" x="0.0" y="0.0" width="375" height="667"/><autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/><color key="backgroundColor" red="1" green="1" blue="1" alpha="1" colorSpace="custom" customColorSpace="sRGB"/><viewLayoutGuide key="safeArea" id="6Tk-OE-BBY"/></view></viewController><placeholder placeholderIdentifier="IBFirstResponder" id="iYj-Kq-Ea1" userLabel="First Responder" sceneMemberID="firstResponder"/></objects><point key="canvasLocation" x="53" y="375"/></scene></scenes></document>' > dependencies/ios/Base.lproj/LaunchScreen.storyboard
      - name: Apply Source Patches
        run: |
          # 1. Path/Header fixes (keep these as they are)
          find . -type f \( -name "*.hpp" -o -name "*.cpp" -o -name "*.h" \) \
            -exec sed -i '' 's|Vorbis/vorbisfile.h|vorbis/vorbisfile.h|g' {} +
          find . -type f \( -name "*.hpp" -o -name "*.cpp" -o -name "*.h" \) \
            -exec sed -i '' 's|Vorbis/codec.h|vorbis/codec.h|g' {} +
          find . -type f \( -name "*.hpp" -o -name "*.cpp" -o -name "*.h" \) \
            -exec sed -i '' 's|REGION_JP|RETRO_JP|g' {} +

          # 2. Safely disable missing entities using C++ preprocessor directives
          # This prevents "undeclared identifier" errors without breaking code structure
          entities=("AchievementsMenu" "RetroGameLoop" "LeaderboardMenu" "VirtualDPad" "MultiplayerHandler")
          
          for entity in "${entities[@]}"; do
            sed -i '' "s/.*CREATE_ENTITY($entity).*/#if 0\n    & \/\/ Disabled due to missing dependency\n#endif/" RSDKv4/Userdata.cpp
          done

      - name: Build RSDKv4
        run: |
          xcodebuild -project "RSDKv4 ios.xcodeproj" \
            -scheme "RSDKv4" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            WARNING_CFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-deprecated-declarations -Wno-nonportable-include-path" \
            HEADER_SEARCH_PATHS="./RSDKv4 ./dependencies/ios $(brew --prefix sdl2)/include $(brew --prefix libvorbis)/include $(brew --prefix libogg)/include $(brew --prefix tinyxml2)/include" \
            LIBRARY_SEARCH_PATHS="./dependencies/ios $(brew --prefix sdl2)/lib $(brew --prefix libvorbis)/lib $(brew --prefix libogg)/lib $(brew --prefix tinyxml2)/lib" \
            GCC_PREPROCESSOR_DEFINITIONS="\$(inherited) RETRO_USING_OPENGL_ES" \
            OTHER_LDFLAGS="-Wl,-fatal_warnings -Wl,-ignore_auto_link" \
            build
      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_DIR=$(find ./build -name "RSDKv4.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then echo "❌ App not found!"; exit 1; fi
          cp -r "$APP_DIR" Payload/
          zip -r "RSDKv4-Build.ipa" Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv4-iOS-IPA
          path: RSDKv4-Build.ipa
