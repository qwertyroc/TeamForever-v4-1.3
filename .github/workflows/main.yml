name: iOS RSDK Build
on:
  push:
  pull_request:
jobs:
  build:
    name: Build RSDKv4 for iOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Dependencies
        run: brew install sdl2 libogg libvorbis tinyxml2

      - name: Install theoraplay
        run: |
          git clone https://github.com/icculus/theoraplay.git /tmp/theoraplay
          mkdir -p dependencies/ios
          cp /tmp/theoraplay/theoraplay.h dependencies/ios/theoraplay.h
          cp /tmp/theoraplay/theoraplay.c dependencies/ios/theoraplay.c

      - name: Create NativeObjects stub
        run: |
          mkdir -p dependencies/ios
          # Only create the stub if NativeObjects.hpp doesn't already exist in the repo
          if [ ! -f "dependencies/ios/NativeObjects.hpp" ] && [ ! -f "RSDKv4/NativeObjects.hpp" ]; then
            cat > dependencies/ios/NativeObjects.hpp << 'STUB'
          #pragma once
          // Stub NativeObjects.hpp for CI build
          STUB
          fi

      - name: Build and Pack
        run: |
          SDL2_PATH=$(brew --prefix sdl2)
          VORBIS_PATH=$(brew --prefix libvorbis)
          OGG_PATH=$(brew --prefix libogg)
          TINYXML2_PATH=$(brew --prefix tinyxml2)
          PREPROCESSOR_DEFS='$(inherited) RSDK_REVISION=0 RETRO_USING_OPENGL_ES'

          mkdir -p dependencies/ios
          touch dependencies/ios/Data.rsdk
          touch dependencies/ios/Default.png

          xcodebuild -project "RSDKv4 ios.xcodeproj" \
                     -scheme "RSDKv4" \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath ./build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     FRAMEWORK_SEARCH_PATHS="./dependencies/ios $SDL2_PATH/lib $VORBIS_PATH/lib $OGG_PATH/lib $TINYXML2_PATH/lib" \
                     HEADER_SEARCH_PATHS="./dependencies/ios $SDL2_PATH/include $VORBIS_PATH/include $OGG_PATH/include $TINYXML2_PATH/include" \
                     LIBRARY_SEARCH_PATHS="./dependencies/ios $SDL2_PATH/lib $VORBIS_PATH/lib $OGG_PATH/lib $TINYXML2_PATH/lib" \
                     GCC_PREPROCESSOR_DEFINITIONS="$PREPROCESSOR_DEFS" \
                     EXCLUDED_SOURCE_FILE_NAMES="*/dependencies/mac/* dependencies/mac/*" \
                     build

          mkdir -p Payload
          APP_DIR=$(find ./build -name "RSDKv4.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then echo "❌ App not found!"; exit 1; fi
          cp -r "$APP_DIR" Payload/

          SHORT_SHA=$(git rev-parse --short HEAD)
          IPA_NAME="RSDKv4-Build-${SHORT_SHA}.ipa"
          zip -r "$IPA_NAME" Payload
          echo "IPA_FILENAME=$IPA_NAME" >> $GITHUB_ENV

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv4-iOS-Package
          path: "*.ipa"
