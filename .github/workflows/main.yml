name: Build iOS Project

on: [push, pull_request]

jobs:
  build:
    name: Build RSDKv4 iOS
    # macos-latest currently defaults to a runner that supports newer Xcode versions
    runs-on: macos-latest 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Ensures theoraplay and other submodules are fetched if applicable

      - name: Install Dependencies
        run: |
          brew update
          brew install sdl2 libvorbis libogg tinyxml2

      - name: Locate theoraplay.h (Diagnostic)
        run: |
          echo "Searching for theoraplay.h in the repository..."
          find . -name "theoraplay.h"
      - name: List files in dependencies/ios
        run: ls -R dependencies/ios
      - name: Checkout LFS
        run: git lfs pull
      - name: Build iOS App
        run: |
          # 1. Create a dummy Data.rsdk to satisfy Xcode's Copy Bundle Resources phase
          mkdir -p dependencies/ios
          touch dependencies/ios/Data.rsdk

          # 2. Define paths using brew
          SDL_INC=$(brew --prefix sdl2)/include
          VORBIS_INC=$(brew --prefix libvorbis)/include
          OGG_INC=$(brew --prefix libogg)/include
          TINYXML_INC=$(brew --prefix tinyxml2)/include
          
          # Use absolute path for the workspace root
          ROOT_DIR=$(pwd)
          
          # Construct Header Search Paths using absolute paths
          HEADERS="$ROOT_DIR/RSDKv4 $ROOT_DIR/dependencies/ios $ROOT_DIR/theoraplay/src $SDL_INC $VORBIS_INC $OGG_INC $TINYXML_INC"
          
          # Construct Library Search Paths using absolute paths
          LIBS="$ROOT_DIR/dependencies/ios $(brew --prefix sdl2)/lib $(brew --prefix libvorbis)/lib $(brew --prefix libogg)/lib $(brew --prefix tinyxml2)/lib"
          
          echo "Using Header Search Paths: $HEADERS"
          
          # 3. Run xcodebuild
          xcodebuild clean build \
            -project "RSDKv4 ios.xcodeproj" \
            -scheme "RSDKv4" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            HEADER_SEARCH_PATHS="$HEADERS" \
            LIBRARY_SEARCH_PATHS="$LIBS" \
            GCC_PREPROCESSOR_DEFINITIONS="\$(inherited) RETRO_USING_OPENGL_ES" \
            OTHER_CFLAGS="-Wno-deprecated-declarations -Wno-error"
