name: Build iOS Project

on: [push, pull_request]

jobs:
  build:
    name: Build RSDKv4 iOS
    runs-on: macos-latest 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew update
          brew install sdl2 libvorbis libogg tinyxml2

      - name: Patch Source Code & Prepare Assets
        run: |
          # 1. Fix case-sensitivity include issue in RetroEngine.hpp
          if [ -f "./RSDKv4/RetroEngine.hpp" ]; then
            sed -i '' 's|<Vorbis/vorbisfile.h>|<vorbis/vorbisfile.h>|g' ./RSDKv4/RetroEngine.hpp
          fi
          
          # 2. Create a dummy Data.rsdk to satisfy Xcode's Copy Bundle Resources phase
          mkdir -p dependencies/ios
          touch dependencies/ios/Data.rsdk

          # 3. Create missing build inputs to satisfy Xcode's Compile Sources phase
          touch ./RSDKv4/RetroGameLoop.cpp
          touch ./RSDKv4/PauseMenu.cpp
      - name: Patch Source Code & Prepare Assets
        run: |
          # 1. Fix case-sensitivity include issue in RetroEngine.hpp
          if [ -f "./RSDKv4/RetroEngine.hpp" ]; then
            sed -i '' 's|<Vorbis/vorbisfile.h>|<vorbis/vorbisfile.h>|g' ./RSDKv4/RetroEngine.hpp
          fi
          
          # 2. Create a dummy Data.rsdk to satisfy Xcode's Copy Bundle Resources phase
          mkdir -p dependencies/ios
          touch dependencies/ios/Data.rsdk
          
          # 3. Create missing build inputs to satisfy Xcode Compile Sources phase
          touch ./RSDKv4/RetroGameLoop.cpp
      - name: Build iOS App
        run: |
          # --- DYNAMIC HEADER DISCOVERY ---
          THEORA_PATH=$(find . -name "theoraplay.h" | head -n 1)
          if [ -n "$THEORA_PATH" ]; then
            THEORA_DIR=$(cd "$(dirname "$THEORA_PATH")" && pwd)
          else
            THEORA_DIR=""
          fi
          
          NATIVE_PATH=$(find . -name "NativeObjects.hpp" | head -n 1)
          if [ -n "$NATIVE_PATH" ]; then
            NATIVE_DIR=$(cd "$(dirname "$NATIVE_PATH")" && pwd)
          else
            NATIVE_DIR=""
          fi

          # --- LINKER FIXES ---
          # 1. Provide a dummy main() because SDL redefines yours to SDL_main
          echo "int main(int argc, char *argv[]) { return 0; }" > dummy_main.c
          clang -c dummy_main.c -target arm64-apple-ios13.0 -o dummy_main.o
          
          # 2. Create dummy frameworks/libraries to satisfy Xcode's Link Binary phase
          mkdir -p dependencies/ios
          ar rcs dependencies/ios/libSDLMain.a dummy_main.o
          
          for fw in Ogg Vorbis SDL2; do
            mkdir -p dependencies/ios/${fw}.framework
            echo "void dummy_${fw}() {}" > dummy_${fw}.c
            clang -c dummy_${fw}.c -target arm64-apple-ios13.0 -o dummy_${fw}.o
            ar rcs dependencies/ios/${fw}.framework/${fw} dummy_${fw}.o
          done

          # --- BUILD CONFIGURATION ---
          SDL_INC=$(brew --prefix sdl2)/include
          VORBIS_INC=$(brew --prefix libvorbis)/include
          OGG_INC=$(brew --prefix libogg)/include
          TINYXML_INC=$(brew --prefix tinyxml2)/include
          ROOT_DIR=$(pwd)
          
          HEADERS="$ROOT_DIR/RSDKv4 $ROOT_DIR/dependencies/ios $THEORA_DIR $NATIVE_DIR $SDL_INC $VORBIS_INC $OGG_INC $TINYXML_INC"
          
          # Run xcodebuild
          xcodebuild clean build \
            -project "RSDKv4 ios.xcodeproj" \
            -scheme "RSDKv4" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            HEADER_SEARCH_PATHS="$HEADERS" \
            FRAMEWORK_SEARCH_PATHS="$ROOT_DIR/dependencies/ios" \
            LIBRARY_SEARCH_PATHS="$ROOT_DIR/dependencies/ios" \
            GCC_PREPROCESSOR_DEFINITIONS="\$(inherited) RETRO_USING_OPENGL_ES" \
            OTHER_CFLAGS="-Wno-deprecated-declarations -Wno-error" \
            OTHER_LDFLAGS="\$(inherited) -undefined dynamic_lookup $ROOT_DIR/dummy_main.o"
        shell: /bin/bash -e {0}
