name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install sdl2 libvorbis libogg tinyxml2

      - name: Prepare Assets
        run: |
          # Ensure the directory exists
          mkdir -p dependencies/ios
          # Create a dummy file if it's missing, or ensure the real one is here
          touch dependencies/ios/Data.rsdk
          touch dependencies/ios/Default.png
      - name: Debug Header Location
        run: |
          echo "Looking for theoraplay.h..."
          find . -name "theoraplay.h"
      - name: Build Project
        run: |
          # Update this path to the ACTUAL directory where theoraplay.h resides
          # Example: If it's in a folder called 'theoraplay' inside your project root:
          THEORAPLAY_DIR="./theoraplay" 
          
          SDL_INC=$(brew --prefix sdl2)/include
          VORBIS_INC=$(brew --prefix libvorbis)/include
          OGG_INC=$(brew --prefix libogg)/include
          TINYXML_INC=$(brew --prefix tinyxml2)/include
          
          HEADERS="./RSDKv4 ./dependencies/ios $THEORAPLAY_DIR $SDL_INC $VORBIS_INC $OGG_INC $TINYXML_INC"
          
          xcodebuild -project "RSDKv4 ios.xcodeproj" \
            -scheme "RSDKv4" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            HEADER_SEARCH_PATHS="$HEADERS" \
            LIBRARY_SEARCH_PATHS="./dependencies/ios $(brew --prefix sdl2)/lib $(brew --prefix libvorbis)/lib $(brew --prefix libogg)/lib $(brew --prefix tinyxml2)/lib" \
            GCC_PREPROCESSOR_DEFINITIONS="\$(inherited) RETRO_USING_OPENGL_ES" \
            build
