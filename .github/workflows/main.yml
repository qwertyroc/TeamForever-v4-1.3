name: iOS RSDK Build

on:
  push:
    branches: [ "foreve" ]
  pull_request:
    branches: [ "foreve" ]

jobs:
  build:
    name: Build RSDKv4 for iOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build and Pack
        run: |
          # 1. Setup Workspace (Skip brew, it's causing the mismatch)
          mkdir -p dependencies/ios
          touch dependencies/ios/Data.rsdk
          
          # 2. Compile using internal frameworks ONLY
          xcodebuild -project "RSDKv4 ios.xcodeproj" \
                     -scheme "RSDKv4" \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     FRAMEWORK_SEARCH_PATHS="./dependencies/ios" \
                     GCC_PREPROCESSOR_DEFINITIONS='$(inherited) RSDK_REVISION=0 RETRO_USING_OPENGL_ES' \
                     EXCLUDED_SOURCE_FILE_NAMES="dependencies/mac/*" \
                     build
          
          # 3. Create IPA Structure
          mkdir -p Payload
          APP_DIR=$(find ~/Library/Developer/Xcode/DerivedData -name "RSDKv4.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then echo "❌ App not found!"; exit 1; fi
          cp -r "$APP_DIR" Payload/
          zip -r RSDKv4.ipa Payload



      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv4-iOS-Package
          path: RSDKv4.ipa
