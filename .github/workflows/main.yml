name: iOS Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Playable RSDKv4 iOS
    runs-on: macos-latest 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools
        run: |
          brew update
          brew install sdl2 libvorbis libogg tinyxml2

      - name: Build iOS App (All-in-One)
        run: |
          echo "=== 0. EXTRACTING FRAMEWORKS ==="
          mkdir -p dependencies/ios
          cd dependencies/ios
          
          # Unzip the frameworks so the compiler can actually see them!
          for fw in SDL2 Ogg Vorbis; do
            if [ -f "${fw}.framework.zip" ]; then
              echo "Extracting ${fw}.framework.zip..."
              unzip -q -o "${fw}.framework.zip"
            fi
          done
          cd ../..

          echo "=== 1. GENERATING BYPASSES ==="
          
          # Fix case-sensitivity include issue
          if [ -f "./RSDKv4/RetroEngine.hpp" ]; then
            sed -i '' 's|<Vorbis/vorbisfile.h>|<vorbis/vorbisfile.h>|g' ./RSDKv4/RetroEngine.hpp
          fi
          
          # SMART FILE FINDER: Find the REAL missing files instead of making blank ones!
          for missing_file in "RetroGameLoop.cpp" "PauseMenu.cpp"; do
            REAL_FILE=$(find . -name "$missing_file" | head -n 1)
            if [ -n "$REAL_FILE" ] && [ "$REAL_FILE" != "./RSDKv4/$missing_file" ]; then
              echo "Found real $missing_file. Copying to ./RSDKv4/"
              cp "$REAL_FILE" "./RSDKv4/$missing_file"
            else
              echo "Creating blank file for $missing_file"
              touch "./RSDKv4/$missing_file"
            fi
          done
          
          # Create the dummy Data.rsdk game file 
          mkdir -p dependencies/ios
          touch dependencies/ios/Data.rsdk
          
          # Generate Info.plist if missing (WITH FILES APP PERMISSIONS AND CUSTOM NAME)
          if [ ! -f "dependencies/ios/Info.plist" ]; then
            cat << 'EOF' > dependencies/ios/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>com.retro.rsdk</string>
              <key>CFBundleName</key>
              <string>RSDKV4</string>
              <key>CFBundleDisplayName</key>
              <string>RSDKV4</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>UIRequiresFullScreen</key>
              <true/>
              <key>UIFileSharingEnabled</key>
              <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
          </dict>
          </plist>
          EOF
          fi
          
          # Create Empty SDLMain to satisfy linker
          echo "void dummy_empty_function() {}" > empty_main.c
          clang -c empty_main.c -target arm64-apple-ios13.0 -o empty_main.o
          ar rcs dependencies/ios/libSDLMain.a empty_main.o
          
          # Remove legacy SDLMain flag from Xcode project
          sed -i '' 's/-lSDLMain//g' "RSDKv4 ios.xcodeproj/project.pbxproj"

          echo "=== 2. FIXING BROKEN SYMLINKS ==="
          for fw in dependencies/ios/*.framework; do
            if [ -d "$fw/Versions/A" ]; then
              cp -r "$fw/Versions/A/"* "$fw/" 2>/dev/null || true
            fi
          done

          echo "=== 3. CONFIGURING PATHS ==="
          ROOT_DIR=$(pwd)
          
          SDL_INC=$(brew --prefix sdl2)/include
          VORBIS_INC=$(brew --prefix libvorbis)/include
          OGG_INC=$(brew --prefix libogg)/include
          TINYXML_INC=$(brew --prefix tinyxml2)/include
          
          THEORA_PATH=$(find . -name "theoraplay.h" | head -n 1)
          THEORA_DIR=$(dirname "$THEORA_PATH")
          
          NATIVE_PATH=$(find . -name "NativeObjects.hpp" | head -n 1)
          NATIVE_DIR=$(dirname "$NATIVE_PATH")
          
          HEADERS="$ROOT_DIR/RSDKv4 $ROOT_DIR/dependencies/ios $ROOT_DIR/$THEORA_DIR $ROOT_DIR/$NATIVE_DIR $SDL_INC $VORBIS_INC $OGG_INC $TINYXML_INC"
          
          echo "=== 4. RUNNING XCODEBUILD ==="
          # ADDED EXPORT DYNAMIC SO MODS CAN SEE THE ENGINE CODE!
          # REMOVED DYNAMIC LOOKUP TO CATCH REAL BUILD ERRORS!
          xcodebuild build \
            -project "RSDKv4 ios.xcodeproj" \
            -scheme "RSDKv4" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            HEADER_SEARCH_PATHS="$HEADERS" \
            FRAMEWORK_SEARCH_PATHS="" \
            LIBRARY_SEARCH_PATHS="$ROOT_DIR/dependencies/ios" \
            GCC_PREPROCESSOR_DEFINITIONS="\$(inherited) RETRO_USING_OPENGL_ES" \
            OTHER_CFLAGS="-Wno-deprecated-declarations -Wno-error" \
            OTHER_LDFLAGS="\$(inherited) -Xlinker -export_dynamic -F$ROOT_DIR/dependencies/ios -framework GameController -framework CoreHaptics -framework CoreMotion"
        shell: /bin/bash -e {0}

      - name: Package IPA
        run: |
          mkdir -p Payload
          mv build/Build/Products/Release-iphoneos/RSDKv4.app Payload/
          zip -r RSDKv4.ipa Payload

      - name: Upload Playable IPA
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv4-iOS
          path: RSDKv4.ipa
